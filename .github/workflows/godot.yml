name: Godot desktop
on:
  push:
    paths: ['godot/**', 'packaging/**', '**.go', 'go.mod', 'go.sum', '.github/workflows/godot.yml']
  pull_request:
    paths: ['godot/**', 'packaging/**', '**.go', 'go.mod', 'go.sum', '.github/workflows/godot.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: '4.7.2'
  GODOT_TEMPLATES_SHA512: 'ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079'

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            godot: Godot_v4.7.2-stable_linux.x86_64
            archive: Godot_v4.7.2-stable_linux.x86_64.zip
            sha512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
            templates_dir: ~/.local/share/godot/export_templates
          - os: macos-26
            godot: Godot_v4.7.2-stable_macos.universal
            archive: Godot_v4.7.2-stable_macos.universal.zip
            sha512: 38aa16e5bba2083941fc5b3e54be0089bd4cc35e32415f5b9fd9a8a6a7b9818255d44532ea8ef94b5aef56c4b407c2d634fa4f657e4ebe681ebbf59b7bac69ca
            templates_dir: ~/Library/Application Support/Godot/export_templates
          - os: windows-2025
            godot: Godot_v4.7.2-stable_win64
            archive: Godot_v4.7.2-stable_win64.exe.zip
            sha512: 83decd58fdf67b9d657958a1ae6bf1929c20785315a81effe245874cdc57acb709bf868e00778a96984338c1b29dafdb453c6847747694621c6ecf5da2259993
            templates_dir: ~/AppData/Roaming/Godot/export_templates
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Godot and export templates
        run: |
          verify_sha512() {
            local file="$1" expected="$2" actual
            if command -v sha512sum >/dev/null 2>&1; then
              actual="$(sha512sum "$file" | awk '{print $1}')"
            else
              actual="$(shasum -a 512 "$file" | awk '{print $1}')"
            fi
            if [ "$actual" != "$expected" ]; then
              echo "SHA-512 mismatch for $file: got $actual, expected $expected" >&2
              exit 1
            fi
          }
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" "$base/${{ matrix.archive }}"
          verify_sha512 "$RUNNER_TEMP/godot.zip" "${{ matrix.sha512 }}"
          curl -fsSL -o "$RUNNER_TEMP/templates.tpz" "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          verify_sha512 "$RUNNER_TEMP/templates.tpz" "$GODOT_TEMPLATES_SHA512"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          templates="${{ matrix.templates_dir }}"
          templates="${templates/#\~/$HOME}/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          mv "$RUNNER_TEMP/templates/templates/"* "$templates/"
          if [ "$RUNNER_OS" = "macOS" ]; then
            godot="$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            godot="$RUNNER_TEMP/godot/${{ matrix.godot }}_console.exe"
          else
            godot="$RUNNER_TEMP/godot/${{ matrix.godot }}"
            chmod +x "$godot"
          fi
          echo "GODOT=$godot" >> "$GITHUB_ENV"
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libflac-dev libvorbis-dev libogg-dev libmpg123-dev
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install flac libvorbis libogg mpg123 pkg-config
      - name: Windows codec toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-flac
            mingw-w64-x86_64-mpg123
      - name: Frontend checks
        run: |
          "$GODOT" --headless --path godot --import --quit
          "$GODOT" --headless --path godot res://tools/check.tscn
          GODOT_BIN="$GODOT" "$GODOT" --headless --path godot -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd --ignoreHeadlessMode -a res://tests/unit
          for t in backend_test dialogs_test logic_test run_tests pages_smoke ui_smoke; do
            "$GODOT" --headless --path godot "res://tests/$t.tscn"
          done
      - name: Build Linux/macOS bundle
        if: runner.os != 'Windows'
        run: python3 godot/tool/build.py --godot "$GODOT"
      - name: Build Windows bundle
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CGO_ENABLED: '1'
          CGO_LDFLAGS: '-Wl,-Bstatic -logg -Wl,-Bdynamic'
        run: python godot/tool/build.py --godot "$(cygpath -u "$GODOT")"
      - name: Linux engine integration
        if: runner.os == 'Linux'
        env:
          CLIAMP_BINARY: ${{ github.workspace }}/godot/build/linux/cliamp
        run: |
          export HOME="$RUNNER_TEMP/home" CLIAMP_CONFIG_DIR="$RUNNER_TEMP/cfg" XDG_CONFIG_HOME="$RUNNER_TEMP/xdg" XDG_DATA_HOME="$RUNNER_TEMP/data"
          mkdir -p "$HOME" "$CLIAMP_CONFIG_DIR"
          "$GODOT" --headless --path godot res://tests/engine_smoke.tscn
          "$GODOT" --headless --path godot res://tests/engine_dialogs.tscn
          mkdir -p "$RUNNER_TEMP/plugins" && cp plugins/auto-eq.lua "$RUNNER_TEMP/plugins/hello-eq.lua"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/plugins" &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            if curl --noproxy 127.0.0.1 -fsSo /dev/null http://127.0.0.1:8765/hello-eq.lua; then
              break
            fi
            sleep 0.1
          done
          curl --noproxy 127.0.0.1 -fsSo /dev/null http://127.0.0.1:8765/hello-eq.lua
          PLUGIN_URL=http://127.0.0.1:8765/hello-eq.lua "$GODOT" --headless --path godot res://tests/engine_plugins.tscn
      - name: Save native development bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cliamp-godot-${{ runner.os }}-${{ runner.arch }}
          path: godot/build/**
          if-no-files-found: error
