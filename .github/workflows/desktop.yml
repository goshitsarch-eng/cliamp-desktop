name: Desktop
on:
  push:
    paths: ['desktop/**', '**.go', 'go.mod', 'go.sum', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', '**.go', 'go.mod', 'go.sum', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/checkout@v7.0.1
        with:
          repository: flutter/flutter
          ref: 3.47.7
          path: .flutter-sdk
          persist-credentials: false
      - name: Activate Flutter
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.flutter-sdk/bin" >> "$GITHUB_PATH"
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libasound2-dev libflac-dev libvorbis-dev libogg-dev libmpg123-dev
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install flac libvorbis libogg mpg123 pkg-config
      - name: Windows codec toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-flac
            mingw-w64-x86_64-mpg123
      - name: Frontend checks
        working-directory: desktop
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
      - name: Build Linux/macOS bundle
        if: runner.os != 'Windows'
        run: python3 desktop/tool/build.py
      - name: Build Windows bundle
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CGO_ENABLED: '1'
          CGO_LDFLAGS: '-Wl,-Bstatic -logg -Wl,-Bdynamic'
        run: python desktop/tool/build.py
      - name: Linux adapter integration
        if: runner.os == 'Linux'
        working-directory: desktop
        env:
          CLIAMP_BINARY: ${{ github.workspace }}/desktop/build/linux/x64/release/bundle/cliamp
        run: dart run tool/backend_smoke.dart
      - name: Save native development bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cliamp-desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            desktop/build/linux/*/release/bundle/**
            desktop/build/macos/Build/Products/Release/Cliamp.app/**
            desktop/build/windows/*/runner/Release/**
          if-no-files-found: error
