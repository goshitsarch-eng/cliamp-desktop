app-id: io.github.goshitsarch_eng.Cliamp
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20
command: cliamp-desktop
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # The player opens whatever library path the user picks.
  - --filesystem=host
  - --own-name=org.mpris.MediaPlayer2.cliamp
  - --talk-name=org.freedesktop.Notifications
  - --env=ALSA_CONFIG_PATH=/app/etc/asound.conf
build-options:
  append-path: /usr/lib/sdk/llvm20/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
  no-debuginfo: true
modules:
  - name: cliamp
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
      no-debuginfo: true
    build-commands:
      - sh packaging/flatpak/build.sh
    sources:
      - type: git
        path: ../..
        branch: main
      - type: archive
        dest: sdk/go
        url: https://go.dev/dl/go1.26.10.linux-amd64.tar.gz
        sha256: ccfe7ae822d2c2f41f4fe7c956199967a4dac22d0ee0d2b2bfdb440aab3b20c5
      - type: archive
        dest: sdk/godot
        strip-components: 0
        url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
        sha512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
      - type: file
        dest: sdk
        url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
        sha512: ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079
